name: flutter_application_1
description: "Aplicativo oficial da Home's Pizzaria para cardápio e orçamentos."
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  carousel_slider: ^4.2.1
  google_fonts: ^6.2.0
  url_launcher: ^6.2.5
  flutter_launcher_icons: ^0.14.4
  dynamic_fonts: ^2.2.1
  pdf: ^3.6.0
  printing: ^5.6.0
  path_provider: ^2.0.10
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  shared_preferences: ^2.5.6
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  



  
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/logo_colorida.png'
  adaptive_icon_background: '#FFF8EC'
  adaptive_icon_foreground: 'assets/images/logo_colorida.png'
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: '#FFF8EC'
  min_sdk_android: 21
  



flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/docs/
    


